<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三人麻雀 牌効率トレーニング</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="home-screen" class="home-screen">
    <p class="eyebrow">SANMA PRACTICE</p>
    <h1>麻雀トレーニング</h1>
    <p class="home-lead">遊びたいメニューを選択してください。</p>
    <section class="mode-list" aria-label="トレーニングメニュー">
      <button id="open-efficiency" class="mode-card" type="button">
        <span class="mode-icon">牌</span>
        <span class="mode-content"><strong>何切るトレーニング</strong><small>一人でテンパイまでの最適な選択を練習</small></span>
        <span class="mode-arrow">›</span>
      </button>
      <div class="mode-card coming-soon" aria-label="今後追加予定のメニュー">
        <span class="mode-icon">＋</span>
        <span class="mode-content"><strong>今後のトレーニング</strong><small>新しい機能を追加予定です</small></span>
      </div>
    </section>
  </main>

  <main id="game-screen" class="app-shell" hidden>
    <header>
      <div>
        <p class="eyebrow">SANMA • TILE EFFICIENCY</p>
        <h1>何切るトレーニング</h1>
      </div>
      <div class="header-actions"><button id="back-home" class="secondary">トップへ</button><button id="new-game" class="secondary">最初から</button></div>
    </header>

    <section class="rules" aria-label="ルール">
      <span>三人打ち</span><span>全赤</span><span>北抜きドラ</span><span>花牌なし</span>
      <strong>自分がテンパイすればクリア。他家の河はランダムな捨て牌です。</strong>
    </section>

    <section class="table" aria-live="polite">
      <div class="opponent left">
        <div class="player-heading"><span class="seat">西</span><strong>架空の他家 A</strong><span id="cpu-a-state" class="state">ランダムな捨て牌</span></div>
        <div id="cpu-a-hand" class="opponent-hand"></div>
        <div id="cpu-a-river" class="river"></div>
      </div>

      <div class="table-center">
        <div class="round-badge">東 1 局</div>
        <div id="wall-count" class="wall-count">山 0枚</div>
        <div class="dora-display"><span>ドラ表示牌</span><div id="dora-indicator"></div></div>
        <div id="message" class="message">開始を待っています</div>
        <div id="danger" class="danger" hidden></div>
      </div>

      <div class="opponent right">
        <div class="player-heading"><span class="seat">北</span><strong>架空の他家 B</strong><span id="cpu-b-state" class="state">ランダムな捨て牌</span></div>
        <div id="cpu-b-hand" class="opponent-hand"></div>
        <div id="cpu-b-river" class="river"></div>
      </div>
    </section>

    <section class="you">
      <div class="player-heading"><span class="seat you-seat">南</span><strong>あなた</strong><span id="you-state" class="state"></span></div>
      <p id="instruction">「ゲームを始める」を押してください。</p>
      <div id="your-hand" class="your-hand"></div>
      <div class="you-bottom">
        <div><span class="label">捨て牌</span><div id="your-river" class="river"></div></div>
        <button id="start-game" class="primary">ゲームを始める</button>
      </div>
    </section>
  </main>
  <dialog id="result-dialog">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <button id="play-again" class="primary">もう一局遊ぶ</button>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
